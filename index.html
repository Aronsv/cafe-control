<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe Control - 6:30</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8a5a33">
</head>
<body>

  <section id="loginView" class="screen">
    <div class="card login-card">
      <h1 class="logo">☕ Cafe Control</h1>
      <input id="email" type="email" placeholder="Usuario o Correo">
      <div class="password-row">
        <input id="password" type="password" placeholder="Contraseña">
        <button id="togglePassword" type="button" class="icon-btn">👁</button>
      </div>
      <button id="btnLogin" class="btn btn-brown">Iniciar sesión</button>
    </div>
  </section>

  <section id="staffView" class="screen hidden">
    <div class="staff-shell">
      <div class="card staff-card">
        <h1 class="logo">6:30 Specialty Coffee</h1>
        <div class="mensaje-wrap"><p id="mensajeStaff">Cargando...</p></div>
        <div class="botones-wrap">
          <button id="btnAsistencia" class="btn">Registrar ingreso</button>
          <button id="btnBreak" class="btn" disabled>Iniciar break</button>
          <textarea id="obsDia" placeholder="Observación (opcional)" class="input-obs"></textarea>
          <button id="btnLogoutStaff" class="btn btn-dark">Cerrar sesión</button>
        </div>
      </div>
      <nav class="staff-bottom-nav">
        <button class="nav-tab active"><span>📋</span><label>Asistencia</label></button>
        <button class="nav-tab"><span>✅</span><label>Tareas</label></button>
        <button class="nav-tab"><span>🛒</span><label>Inventario</label></button>
      </nav>
    </div>
  </section>

  <section id="adminView" class="screen hidden">
    <div class="admin-layout" id="adminLayout">
      <aside class="admin-sidebar" id="sidebar">
        <div class="sidebar-header">
          <span class="brand">6:30</span>
          <button id="btnToggleSidebar" class="icon-btn">☰</button>
        </div>
        <nav class="sidebar-nav">
          <button class="nav-item active">📊 Dashboard</button>
          <button class="nav-item">👥 Empleados</button>
          <button id="btnLogoutAdmin" class="nav-item logout">Cerrar Sesión</button>
        </nav>
      </aside>

      <main class="admin-main">
        <header class="main-header">
          <button id="btnOpenSidebar" class="btn-open-floating hidden">☰</button>
          <h1>ESTADO EN VIVO</h1>
        </header>

        <section class="summary-grid">
          <div class="summary-card">
            <div class="card-icon">👤</div>
            <div class="card-info">
              <span class="label">EMPLEADOS EN TURNO</span>
              <span id="countTrabajando" class="value">0</span>
            </div>
          </div>
          <div class="summary-card">
            <div class="card-icon">☕</div>
            <div class="card-info">
              <span class="label">EMPLEADOS EN BREAK</span>
              <span id="countBreak" class="value">0</span>
            </div>
          </div>
          <div class="summary-card">
            <div class="card-icon">📝</div>
            <div class="card-info">
              <span class="label">PENDIENTES INGRESO</span>
              <span id="countInicio" class="value">0</span>
            </div>
          </div>
          <div class="summary-card">
            <div class="card-icon">👥</div>
            <div class="card-info">
              <span class="label">TOTAL TRABAJADORES</span>
              <span id="countTotal" class="value">0</span>
            </div>
          </div>
          <div class="summary-card donut-card">
            <div class="donut-wrap">
              <svg viewBox="0 0 42 42">
                <circle class="donut-bg" cx="21" cy="21" r="15.9155"></circle>
                <circle id="arcTrabajando" class="donut-segment donut-green" cx="21" cy="21" r="15.9155"></circle>
                <circle id="arcBreak" class="donut-segment donut-gold" cx="21" cy="21" r="15.9155"></circle>
              </svg>
            </div>
          </div>
        </section>

        <div class="table-header-admin">
          <span>NOMBRE</span><span>TURNO</span><span>ESTADO</span><span>BREAKS</span><span>ACCIONES</span>
        </div>
        <div id="adminHistoryList" class="history-list"></div>
      </main>
    </div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
