<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe Control - 6:30</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8a5a33">
</head>
<body>

  <section id="loginView" class="screen">
    <div class="card login-card">
      <h1 class="logo">☕ Cafe Control</h1>
      <p class="subtitle">Acceso al sistema</p>
      <input id="email" type="email" placeholder="Usuario o Correo">
      <div class="password-row">
        <input id="password" type="password" placeholder="Contraseña">
        <button id="togglePassword" type="button" class="icon-btn">👁</button>
      </div>
      <button id="btnLogin" class="btn btn-brown">Iniciar sesión</button>
      <p id="resetPassword" class="link-text">¿Olvidaste tu contraseña?</p>
    </div>
  </section>

  <section id="staffView" class="screen hidden">
    <div class="staff-shell">
      <div class="card staff-card">
        <h1 class="logo">6:30 Specialty Coffee</h1>
        <div class="mensaje-wrap">
          <p id="mensajeStaff">Cargando estado...</p>
        </div>
        <div class="botones-wrap">
          <button id="btnAsistencia" class="btn">Registrar ingreso</button>
          <button id="btnBreak" class="btn" disabled>Iniciar break</button>
          <textarea id="obsDia" placeholder="Observación del día (opcional)" class="input-obs"></textarea>
          <button id="btnLogoutStaff" class="btn btn-dark">Cerrar sesión</button>
        </div>
      </div>
      <nav class="staff-bottom-nav">
        <button class="nav-tab active"><span>📋</span><span>Asistencia</span></button>
        <button class="nav-tab"><span>✅</span><span>Tareas</span></button>
        <button class="nav-tab"><span>🛒</span><span>Inventario</span></button>
      </nav>
    </div>
  </section>

<section id="adminView" class="screen hidden">
  <div class="dashboard-page">
    <header class="dashboard-header">
      <div>
        <h1 class="dashboard-title">ESTADO EN VIVO</h1>
        <p class="dashboard-subtitle">Panel de Control - 6:30 Specialty Coffee</p>
      </div>
      <button id="btnLogoutAdmin" class="btn btn-dark" style="width:auto; padding:0 20px;">Cerrar Sesión</button>
    </header>

    <section class="summary-grid">
      <div class="summary-card">
        <div class="summary-label">EN TURNO</div>
        <div id="countTrabajando" class="summary-value">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">EN BREAK</div>
        <div id="countBreak" class="summary-value">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">SISTEMA</div>
        <div class="donut-wrap">
          <svg viewBox="0 0 42 42" class="donut-svg">
            <circle class="donut-bg" cx="21" cy="21" r="15.9155"></circle>
            <circle id="arcTrabajando" class="donut-segment donut-green" cx="21" cy="21" r="15.9155" style="stroke-dasharray: 0 100;"></circle>
            <circle id="arcBreak" class="donut-segment donut-gold" cx="21" cy="21" r="15.9155" style="stroke-dasharray: 0 100;"></circle>
          </svg>
        </div>
      </div>
    </section>

    <div id="adminHistoryList" class="history-list">
      <div class="empty-state">Cargando personal...</div>
    </div>
  </div>
</section>

  <script type="module" src="app.js"></script>
</body>
</html>
