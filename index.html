<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>6:30 Control</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section id="loginView" class="screen">
    <div class="card">
      <h1 class="logo">☕ 6:30 Control</h1>
      <input id="email" type="email" placeholder="Usuario">
      <input id="password" type="password" placeholder="Contraseña">
      <button id="btnLogin" class="btn btn-brown">Entrar</button>
    </div>
  </section>

  <section id="staffView" class="screen hidden">
    <div class="staff-shell">
      <div class="card">
        <h2 id="mensajeStaff">Cargando...</h2>
        <button id="btnAsistencia" class="btn">Registrar</button>
        <button id="btnBreak" class="btn" disabled>Break</button>
        <textarea id="obsDia" placeholder="Observaciones..." class="input-obs"></textarea>
        <button id="btnLogoutStaff" class="btn btn-dark">Salir</button>
      </div>
      <nav class="staff-bottom-nav">
        <div class="nav-tab active">📋<span>Asistencia</span></div>
        <div class="nav-tab">✅<span>Tareas</span></div>
        <div class="nav-tab">🛒<span>Inventario</span></div>
      </nav>
    </div>
  </section>

  <section id="adminView" class="screen hidden">
    <div class="admin-layout">
      <aside id="sidebar" class="admin-sidebar">
        <div class="sidebar-header">
          <span class="brand">6:30</span>
          <button id="btnToggleSidebar" class="icon-btn">☰</button>
        </div>
        <nav class="sidebar-nav">
          <button class="nav-item active">📊 Dashboard</button>
          <button class="nav-item">👥 Empleados</button>
          <button id="btnLogoutAdmin" class="nav-item logout">Cerrar Sesión</button>
        </nav>
      </aside>

      <main class="admin-main">
        <button id="btnOpenSidebar" class="btn-open-sidebar hidden">☰</button>
        <header class="main-header"><h1>ESTADO EN VIVO</h1></header>

        <section class="summary-grid">
          <div class="summary-card"><span>👤 EN TURNO</span><strong id="countTrabajando">0</strong></div>
          <div class="summary-card"><span>☕ EN BREAK</span><strong id="countBreak">0</strong></div>
          <div class="summary-card"><span>📝 PENDIENTES</span><strong id="countInicio">0</strong></div>
          <div class="summary-card"><span>👥 TOTAL</span><strong id="countTotal">0</strong></div>
          <div class="summary-card donut-card">
            <svg viewBox="0 0 42 42" class="donut">
              <circle class="donut-bg" cx="21" cy="21" r="15.9"></circle>
              <circle id="arcTrabajando" class="donut-segment donut-green" cx="21" cy="21" r="15.9"></circle>
              <circle id="arcBreak" class="donut-segment donut-gold" cx="21" cy="21" r="15.9"></circle>
            </svg>
          </div>
        </section>

        <div class="table-header-admin">
          <span>NOMBRE</span><span>TURNO</span><span>ESTADO</span><span>BREAKS</span><span>ACCIONES</span>
        </div>
        <div id="adminHistoryList"></div>
      </main>
    </div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
