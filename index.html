<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe Control - 6:30</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8a5a33">
</head>
<body>

  <section id="loginView" class="screen">
    <div class="card login-card">
      <h1 class="logo">☕ Cafe Control</h1>
      <p class="subtitle">Acceso al sistema</p>
      <input id="email" type="email" placeholder="Usuario o Correo">
      <div class="password-row">
        <input id="password" type="password" placeholder="Contraseña">
        <button id="togglePassword" type="button" class="icon-btn">👁</button>
      </div>
      <button id="btnLogin" class="btn btn-brown">Iniciar sesión</button>
      <p id="resetPassword" class="link-text">¿Olvidaste tu contraseña?</p>
    </div>
  </section>

  <section id="staffView" class="screen hidden">
    <div class="staff-shell">
      <div class="card staff-card">
        <h1 class="logo">6:30 Specialty Coffee</h1>
        <div class="mensaje-wrap">
          <p id="mensajeStaff">Cargando estado...</p>
        </div>
        <div class="botones-wrap">
          <button id="btnAsistencia" class="btn">Registrar ingreso</button>
          <button id="btnBreak" class="btn" disabled>Iniciar break</button>
          <textarea id="obsDia" placeholder="Observación del día (opcional)" class="input-obs"></textarea>
          <button id="btnLogoutStaff" class="btn btn-dark">Cerrar sesión</button>
        </div>
      </div>
      <nav class="staff-bottom-nav">
        <button class="nav-tab active"><span>📋</span><span>Asistencia</span></button>
        <button class="nav-tab"><span>✅</span><span>Tareas</span></button>
        <button class="nav-tab"><span>🛒</span><span>Inventario</span></button>
      </nav>
    </div>
  </section>

<section id="adminView" class="screen hidden">
  <div class="admin-layout" id="adminLayout">
    <aside class="admin-sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="brand">6:30</span>
        <button id="toggleSidebar" class="icon-btn">☰</button>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active">📊 Dashboard</button>
        <button class="nav-item">👥 Empleados (Historial)</button>
        <button id="btnLogoutAdmin" class="nav-item logout">Cerrar Sesión</button>
      </nav>
    </aside>

    <main class="admin-main">
      <header class="main-header">
        <button id="openSidebar" class="btn-open-sidebar hidden">☰</button>
        <h1>ESTADO EN VIVO</h1>
      </header>

      <section class="summary-grid">
        <div class="summary-card"><div class="label">EMPLEADOS EN TURNO</div><div id="countTrabajando" class="value">0</div></div>
        <div class="summary-card"><div class="label">EMPLEADOS EN BREAK</div><div id="countBreak" class="value">0</div></div>
        <div class="summary-card"><div class="label">PENDIENTES INGRESO</div><div id="countInicio" class="value">0</div></div>
        <div class="summary-card"><div class="label">TOTAL TRABAJADORES</div><div id="countTotal" class="value">0</div></div>
      </section>

      <div class="table-header-admin">
        <span>NOMBRE</span><span>TURNO</span><span>ESTADO</span><span>BREAKS</span><span>HISTORIAL</span>
      </div>
      <div id="adminHistoryList" class="history-list"></div>
    </main>
  </div>
</section>

  <script type="module" src="app.js"></script>
</body>
</html>
